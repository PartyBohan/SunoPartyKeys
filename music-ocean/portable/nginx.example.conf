# Install only after inspecting the existing gateway and certificate paths.
# This snippet does not alter unrelated virtual hosts.
server {
    listen 443 ssl;
    server_name suno.popumusic.cn;
    ssl_certificate /etc/music-ocean/tls/fullchain.pem;
    ssl_certificate_key /etc/music-ocean/tls/privkey.pem;
    client_max_body_size 13m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
